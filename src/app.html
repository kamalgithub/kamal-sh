<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Must run before the stylesheet SvelteKit injects below, so the
			// explicit theme override (if any) is on the element before first
			// paint — no flash of the wrong theme. See src/lib/utils/theme.ts
			// for the read/write contract this mirrors.
			(function () {
				var stored = localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.setAttribute('data-theme', stored);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
